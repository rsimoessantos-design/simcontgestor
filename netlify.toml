# Netlify Configuration for ContabGest Production Deployment
[build]
  command = "npm run build:client"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# SPA Fallback: Redireciona todas as rotas para o index.html com status 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache imutável para assets compilados com hash
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cabeçalhos de segurança recomendados
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
